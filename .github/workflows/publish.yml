name: Publish Extension

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Sample/**'
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-extension:
    name: Publish Azure DevOps Bicep extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
            dotnet-version: '9.0.x'

      - name: Install Bicep
        run: |
          az config set bicep.use_binary_from_path=false
          az bicep install

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run nbgv
        id: nbgv
        uses: dotnet/nbgv@v0.5.1

      - name: Publish Extension
        shell: pwsh
        run: |
          [string] $repositoryLowercase = "${{ github.repository }}".ToLowerInvariant()
          [string] $target = "br:ghcr.io/$repositoryLowercase/extensions/azuredevops:${{ steps.nbgv.outputs.SimpleVersion }}"
          ./Infra/Scripts/Publish-Extension.ps1 -Target $target

          Write-Host "Published extension \`${$target}\`." >> $GITHUB_STEP_SUMMARY
